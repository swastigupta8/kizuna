version: "3.9"
services:
  api-gateway:
    image: kizuna-demo/api-gateway
    depends_on: [monolith]
    labels: ["kizuna.critical=true"]

  monolith:
    image: kizuna-demo/monolith
    depends_on: [legacy-billing]
    labels: ["kizuna.critical=true"]

  legacy-billing:
    image: kizuna-demo/legacy-billing
    depends_on: [primary-db]
    labels: ["kizuna.critical=true"]

  worker:
    image: kizuna-demo/worker
    depends_on: [monolith]
    labels: []

  primary-db:
    image: postgres:16
    labels: ["kizuna.critical=true"]
