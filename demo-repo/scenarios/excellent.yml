version: "3.9"
services:
  api-gateway:
    image: kizuna-demo/api-gateway
    depends_on: [auth-service, catalog-service, checkout-service]
    deploy: { replicas: 3 }
    labels: ["kizuna.critical=true", "kizuna.circuit_breaker=true", "kizuna.timeout_ms=2000"]

  auth-service:
    image: kizuna-demo/auth-service
    depends_on: [primary-db]
    deploy: { replicas: 3 }
    labels: ["kizuna.critical=true", "kizuna.circuit_breaker=true", "kizuna.timeout_ms=1500"]

  catalog-service:
    image: kizuna-demo/catalog-service
    depends_on: [primary-db, cache]
    deploy: { replicas: 3 }
    labels: ["kizuna.circuit_breaker=true", "kizuna.timeout_ms=1500"]

  checkout-service:
    image: kizuna-demo/checkout-service
    depends_on: [payment-service, primary-db, cache]
    deploy: { replicas: 3 }
    labels: ["kizuna.critical=true", "kizuna.circuit_breaker=true", "kizuna.timeout_ms=2500"]

  payment-service:
    image: kizuna-demo/payment-service
    depends_on: [primary-db]
    deploy: { replicas: 3 }
    labels: ["kizuna.critical=true", "kizuna.circuit_breaker=true", "kizuna.timeout_ms=3000"]

  cache:
    image: redis:7
    deploy: { replicas: 2 }
    labels: ["kizuna.circuit_breaker=true"]

  primary-db:
    image: postgres:16
    deploy: { replicas: 3 }
    labels: ["kizuna.critical=true"]
